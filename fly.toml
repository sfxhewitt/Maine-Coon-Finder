# Fly.io: one small always-on machine (no web traffic, just a worker).
# Change `app` to a unique name before `fly launch --copy-config --no-deploy`.
app = "maine-coon-finder"
primary_region = "lhr"

[build]

[env]
  DB_PATH = "/data/finder.sqlite3"

[mounts]
  source = "finder_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
